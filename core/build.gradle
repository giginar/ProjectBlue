plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

def buildVersion = rootProject.buildVersion
def generatedSources = layout.buildDirectory.dir('generated/sources/buildInfo')
tasks.register('generateBuildInfo') {
    inputs.properties(buildVersion)
    outputs.dir(generatedSources)
    doLast {
        def source = generatedSources.get().file('com/projectblue/game/config/BuildInfo.java').asFile
        source.parentFile.mkdirs()
        source.setText("""package com.projectblue.game.config;

/** Generated by Gradle from the current Git commit. */
public final class BuildInfo {
    private BuildInfo() {}
    public static final String VERSION_NAME = "${buildVersion.versionName}";
    public static final int VERSION_CODE = ${buildVersion.versionCode};
    public static final String GIT_COMMIT = "${buildVersion.gitCommit}";
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedSources)
tasks.named('compileJava') { dependsOn 'generateBuildInfo' }
