privacy.title=Privacy
privacy.subtitle=What this build stores and shares
privacy.local=Project Blue: Ocean Guard stores progress and settings only on this device.
privacy.offline=This build has no account, analytics, cloud upload or advertising SDK. It does not transmit personal data.
privacy.support=For privacy questions, contact ykucukcinar@gmail.com.
privacy.ads_data=This Android build uses Google AdMob and Google's consent service. When ads are permitted, Google may collect device identifiers, approximate location from IP address, ad interactions and diagnostics.
privacy.ads_optional=Ads are optional for rewards. Occasional ads may appear when leaving successful results. Internet is never required to play.
privacy.ads_options=Privacy Options appears in Settings when Google's consent service requires it. You can revisit your choices there.
privacy.no_ads=Advertising requests are disabled in this build. There is no account sign-in, analytics upload or cloud save.
privacy.haptic=Haptic feedback uses the device vibration feature when enabled. It does not collect sensor data.
privacy.reset=Reset profile is available only in development builds. Uninstalling the app may remove local progress.
privacy.local_ads=Local progress stays on your device. Advertising privacy choices are managed separately by Google's consent service when enabled.
