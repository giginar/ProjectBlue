name: Android Debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test commit versioning
        shell: pwsh
        run: ./tools/test-versioning.ps1
      - name: Install Android SDK packages
        run: |
          managers=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
          if [[ ! -x "${managers[0]}" ]]; then
            echo "Android SDK manager is missing under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          "${managers[0]}" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Verify rules and build APK
        run: ./gradlew :check :android:lintDebug :android:packageDebugApk --console=plain
      - name: Verify versioned APK
        id: apk
        run: |
          version=$(jq -r .versionName build/version/version.json)
          filename=$(jq -r .apkFileName build/version/version.json)
          test "$(jq -r .dirty build/version/version.json)" = false
          test "$(jq -r .gitCommit build/version/version.json)" = "$(git rev-parse HEAD)"
          apk="build/artifacts/$version/$filename"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          (cd "build/artifacts/$version" && sha256sum -c "$filename.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "APK version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ProjectBlue-${{ steps.apk.outputs.version }}-debug
          path: build/artifacts/${{ steps.apk.outputs.version }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            core/build/reports/tests/test/
            android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
