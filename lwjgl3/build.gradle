plugins { id 'application' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
application { mainClass = 'com.projectblue.game.lwjgl3.DesktopLauncher' }
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
sourceSets.main.resources.srcDirs = [rootProject.file('assets')]
tasks.named('processResources') { dependsOn rootProject.tasks.named('verifyAssetLicenses') }

// jpackage reads this directory and bundles its jars with a private Java runtime.
tasks.register('prepareWindowsPackage', Sync) {
    group = 'distribution'
    description = 'Collect the desktop application and dependencies for local Windows packaging.'
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('windows-package-input')
}
tasks.named('run') {
    workingDir = rootProject.projectDir
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}
