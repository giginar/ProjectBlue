def nativeProject = project
tasks.register('extractNatives') {
    inputs.files(configurations.natives)
    outputs.dir(layout.buildDirectory.dir('generated/jniLibs'))
    doLast {
        nativeProject.sync { spec ->
            spec.into(layout.buildDirectory.dir('generated/jniLibs'))
            configurations.natives.files.each { archive ->
                def abi = ['arm64-v8a', 'armeabi-v7a', 'x86_64'].find { archive.name.contains(it) }
                if (abi == null) throw new GradleException("Unknown native ABI: $archive.name")
                spec.from(zipTree(archive)) {
                    include '*.so'
                    into abi
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'extractNatives', rootProject.tasks.named('verifyAssetLicenses') }

tasks.register('testAdConfigurationPolicy') {
    group = 'verification'
    doLast {
        validateInternalTestAds(googleTestAds.appId, googleTestAds.rewardedId, googleTestAds.interstitialId)
        [[googleTestAds.appId, 'not-allowlisted', googleTestAds.interstitialId],
         [googleTestAds.rewardedId, googleTestAds.rewardedId, googleTestAds.interstitialId]].each { invalid ->
            try {
                validateInternalTestAds(invalid[0], invalid[1], invalid[2])
                throw new GradleException('internalTest policy accepted a non-allowlisted identifier')
            } catch (GradleException expected) {
                if (!expected.message.contains('accepts only')) throw expected
            }
        }
        try {
            validateProductionAds(true, googleTestAds.appId, googleTestAds.rewardedId, googleTestAds.interstitialId)
            throw new GradleException('Release policy unexpectedly accepted identifiers')
        } catch (GradleException expected) {
            if (!expected.message.startsWith('Missing, invalid, or Google test production identifier:')) throw expected
        }
        validateProductionAds(false, '', '', '')
        logger.lifecycle('Ad configuration policy tests passed.')
    }
}

tasks.register('verifyAdConfigurations') {
    group = 'verification'
    dependsOn 'testAdConfigurationPolicy', 'generateDebugBuildConfig', 'generateQaBuildConfig',
        'generateReleaseBuildConfig', 'generateInternalTestBuildConfig', 'processDebugManifest',
        'processQaMainManifest', 'processReleaseMainManifest', 'processInternalTestMainManifest'
    doLast {
        def generated = layout.buildDirectory.file('generated/source/buildConfig/debug/com/projectblue/game/BuildConfig.java').get().asFile.text
        if (!generated.contains('ADS_ENABLED = true') || !generated.contains('ADS_MODE = "TEST"')
            || !generated.contains(googleTestAds.rewardedId) || !generated.contains(googleTestAds.interstitialId))
            throw new GradleException('Debug must use official Google demo ad units')
        def manifest = layout.buildDirectory.file('intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists()) manifest = layout.buildDirectory.file('intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml').get().asFile
        if (!manifest.text.contains(googleTestAds.appId)) throw new GradleException('Debug must use the official sample App ID')
        ['qa', 'release', 'internalTest'].each { variant ->
            def production = layout.buildDirectory.file("generated/source/buildConfig/$variant/com/projectblue/game/BuildConfig.java").get().asFile.text
            if (!production.contains('UMP_DEBUG_GEOGRAPHY = ""') || !production.contains('UMP_TEST_DEVICE_ID = ""'))
                throw new GradleException("$variant must not contain UMP debug settings")
            if (variant == 'qa' && (!production.contains('ADS_ENABLED = false')
                || !production.contains('ADS_MODE = "DISABLED"') || !production.contains('ADMOB_APP_ID = ""')
                || !production.contains('REWARDED_AD_ID = ""') || !production.contains('INTERSTITIAL_AD_ID = ""')))
                throw new GradleException('QA must keep advertising disabled with empty ad units')
            if (variant == 'release' && !releaseAds && (!production.contains('ADS_ENABLED = false')
                || !production.contains('ADS_MODE = "DISABLED"') || !production.contains('ADMOB_APP_ID = ""')
                || !production.contains('REWARDED_AD_ID = ""') || !production.contains('INTERSTITIAL_AD_ID = ""')))
                throw new GradleException('Disabled release must keep empty ad units')
            if (variant == 'internalTest' && (!production.contains('ADS_ENABLED = true')
                || !production.contains('ADS_MODE = "TEST"') || !production.contains(googleTestAds.appId)
                || !production.contains(googleTestAds.rewardedId) || !production.contains(googleTestAds.interstitialId)))
                throw new GradleException('internalTest must use the exact official Google test configuration')
        }
        def expectedPackages = [debug: 'com.game.diver.oceanguard', qa: 'com.game.diver.oceanguard.qa',
            release: 'com.game.diver.oceanguard', internalTest: 'com.game.diver.oceanguard']
        expectedPackages.each { variant, expected ->
            def candidates = fileTree(layout.buildDirectory.dir('intermediates')).matching {
                include "**/${variant}/**/AndroidManifest.xml"
            }.files.findAll { it.text.contains('package="' + expected + '"') }
            if (candidates.isEmpty()) throw new GradleException("$variant application ID must be $expected")
        }
        logger.lifecycle('Debug ad configuration verified against the official sample IDs.')
        logger.lifecycle('QA/release/internalTest isolation, IDs, UMP settings, and application IDs verified.')
    }
}
tasks.register('verifyDebugAdConfiguration') { dependsOn 'verifyAdConfigurations' }
tasks.named('check') { dependsOn 'verifyAdConfigurations' }

tasks.register('verifyReleaseBundle', JavaExec) {
    group = 'verification'
    description = 'Validate the release AAB with the bundletool version supplied by AGP.'
    dependsOn 'bundleRelease'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'validate', '--bundle=' + layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile.absolutePath
}

tasks.register('verifyReleaseArtifactApplicationId', JavaExec) {
    group = 'verification'
    description = 'Verify the final application ID directly in the release AAB.'
    dependsOn 'bundleRelease'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'dump', 'manifest', '--bundle=' + layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile.absolutePath, '--module=base'
    def manifestOutput = new ByteArrayOutputStream()
    standardOutput = manifestOutput
    doLast {
        if (!(manifestOutput.toString('UTF-8') =~ /package="com\.game\.diver\.oceanguard"/))
            throw new GradleException('Release AAB application ID must be com.game.diver.oceanguard')
        logger.lifecycle('Release AAB application ID verified: com.game.diver.oceanguard')
    }
}

tasks.register('verifyReleaseApplicationId') {
    group = 'verification'
    description = 'Verify the final release application ID in the merged manifest.'
    dependsOn 'processReleaseMainManifest'
    doLast {
        def manifest = layout.buildDirectory.file('intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists()) manifest = layout.buildDirectory.file('intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists() || !(manifest.text =~ /package="com\.game\.diver\.oceanguard"/))
            throw new GradleException('Release application ID must be com.game.diver.oceanguard')
        logger.lifecycle('Release application ID verified: com.game.diver.oceanguard')
    }
}

