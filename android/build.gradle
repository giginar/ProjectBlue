plugins { id 'com.android.application' version '8.13.2' }
// Runtime identifiers are injected by the release environment, never stored in source files.
def envValue = { String name -> providers.environmentVariable(name).getOrElse('') }
def releaseAds = envValue('PB_ADS_ENABLED') == 'true'
def sampleAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleRewardId = 'ca-app-pub-3940256099942544/5224354917'
def sampleInterstitialId = 'ca-app-pub-3940256099942544/1033173712'
def ageTreatment = envValue('PB_AD_AGE_TREATMENT')
def umpUnderAge = envValue('PB_UMP_UNDER_AGE')
def umpDebugGeography = envValue('PB_UMP_DEBUG_GEOGRAPHY')
def umpTestDeviceId = envValue('PB_UMP_TEST_DEVICE_ID')
if (ageTreatment && !(ageTreatment in ['UNSPECIFIED', 'CHILD', 'TEEN'])) throw new GradleException('Invalid PB_AD_AGE_TREATMENT')
if (umpUnderAge && !(umpUnderAge in ['true', 'false'])) throw new GradleException('Invalid PB_UMP_UNDER_AGE')
if (umpDebugGeography && !(umpDebugGeography in ['EEA', 'NOT_EEA', 'REGULATED_US_STATE', 'OTHER']))
    throw new GradleException('Invalid PB_UMP_DEBUG_GEOGRAPHY')
if (umpTestDeviceId && !(umpTestDeviceId ==~ /[0-9A-Fa-f]{32}/))
    throw new GradleException('Invalid PB_UMP_TEST_DEVICE_ID')
if (releaseAds) {
    ['PB_ADMOB_APP_ID', 'PB_REWARDED_AD_ID', 'PB_INTERSTITIAL_AD_ID'].each { key ->
        def separator = key == 'PB_ADMOB_APP_ID' ? '~' : '/'
        if (!(envValue(key) ==~ /ca-app-pub-[0-9]{16}${separator}[0-9]{10}/) || envValue(key).contains('3940256099942544'))
            throw new GradleException("Missing or invalid production identifier: $key")
    }
    if (!ageTreatment || !umpUnderAge) throw new GradleException('Release ads require explicit audience settings: PB_AD_AGE_TREATMENT and PB_UMP_UNDER_AGE')
}
def signingNames = ['OCEANGUARD_UPLOAD_KEYSTORE', 'OCEANGUARD_UPLOAD_KEY_ALIAS',
                    'OCEANGUARD_UPLOAD_STORE_PASSWORD', 'OCEANGUARD_UPLOAD_KEY_PASSWORD']
def hasSigning = signingNames.every { envValue(it) }
if (signingNames.any { envValue(it) } && !hasSigning) {
    throw new GradleException('Incomplete Ocean Guard upload signing environment; set all four OCEANGUARD_UPLOAD_* variables')
}
android {
    buildFeatures { buildConfig = true }
    namespace = 'com.projectblue.game'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.game.diver.oceanguard'
        minSdk = 26
        targetSdk = 36
        versionCode = rootProject.buildVersion.versionCode
        versionName = rootProject.buildVersion.versionName
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        buildConfigField 'String', 'AD_AGE_TREATMENT', '"' + (ageTreatment ?: 'UNSPECIFIED') + '"'
        buildConfigField 'int', 'UMP_UNDER_AGE', umpUnderAge ? (umpUnderAge == 'true' ? '1' : '0') : '-1'
    }
    signingConfigs {
        if (hasSigning) {
            upload {
                storeFile = file(envValue('OCEANGUARD_UPLOAD_KEYSTORE'))
                keyAlias = envValue('OCEANGUARD_UPLOAD_KEY_ALIAS')
                storePassword = envValue('OCEANGUARD_UPLOAD_STORE_PASSWORD')
                keyPassword = envValue('OCEANGUARD_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: sampleAppId]
            buildConfigField 'boolean', 'ADS_ENABLED', 'true'
            buildConfigField 'String', 'REWARDED_AD_ID', '"' + sampleRewardId + '"'
            buildConfigField 'String', 'INTERSTITIAL_AD_ID', '"' + sampleInterstitialId + '"'
            buildConfigField 'String', 'UMP_DEBUG_GEOGRAPHY', '"' + umpDebugGeography + '"'
            buildConfigField 'String', 'UMP_TEST_DEVICE_ID', '"' + umpTestDeviceId.toUpperCase(Locale.ROOT) + '"'
            minifyEnabled false
            shrinkResources = false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [admobAppId: releaseAds ? envValue('PB_ADMOB_APP_ID') : sampleAppId]
            buildConfigField 'boolean', 'ADS_ENABLED', releaseAds.toString()
            buildConfigField 'String', 'REWARDED_AD_ID', '"' + (releaseAds ? envValue('PB_REWARDED_AD_ID') : '') + '"'
            buildConfigField 'String', 'INTERSTITIAL_AD_ID', '"' + (releaseAds ? envValue('PB_INTERSTITIAL_AD_ID') : '') + '"'
            buildConfigField 'String', 'UMP_DEBUG_GEOGRAPHY', '""'
            buildConfigField 'String', 'UMP_TEST_DEVICE_ID', '""'
            if (hasSigning) signingConfig signingConfigs.upload
        }
        qa {
            initWith release
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            signingConfig = signingConfigs.debug
            manifestPlaceholders = [admobAppId: sampleAppId]
            buildConfigField 'boolean', 'ADS_ENABLED', 'false'
            buildConfigField 'String', 'REWARDED_AD_ID', '""'
            buildConfigField 'String', 'INTERSTITIAL_AD_ID', '""'
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        assets.srcDirs = [rootProject.file('assets')]
        jniLibs.srcDirs = [layout.buildDirectory.dir('generated/jniLibs')]
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
configurations { natives }
dependencies {
    implementation project(':core')
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}
def nativeProject = project
tasks.register('extractNatives') {
    inputs.files(configurations.natives)
    outputs.dir(layout.buildDirectory.dir('generated/jniLibs'))
    doLast {
        nativeProject.sync { spec ->
            spec.into(layout.buildDirectory.dir('generated/jniLibs'))
            configurations.natives.files.each { archive ->
                def abi = ['arm64-v8a', 'armeabi-v7a', 'x86_64'].find { archive.name.contains(it) }
                if (abi == null) throw new GradleException("Unknown native ABI: $archive.name")
                spec.from(zipTree(archive)) {
                    include '*.so'
                    into abi
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'extractNatives', rootProject.tasks.named('verifyAssetLicenses') }

tasks.register('verifyDebugAdConfiguration') {
    group = 'verification'
    dependsOn 'generateDebugBuildConfig', 'generateQaBuildConfig', 'generateReleaseBuildConfig', 'processDebugManifest'
    doLast {
        def generated = layout.buildDirectory.file('generated/source/buildConfig/debug/com/projectblue/game/BuildConfig.java').get().asFile.text
        if (!generated.contains('ADS_ENABLED = true') || !generated.contains(sampleRewardId) || !generated.contains(sampleInterstitialId))
            throw new GradleException('Debug must use official Google demo ad units')
        def manifest = layout.buildDirectory.file('intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists()) manifest = layout.buildDirectory.file('intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml').get().asFile
        if (!manifest.text.contains(sampleAppId)) throw new GradleException('Debug must use the official sample App ID')
        ['qa', 'release'].each { variant ->
            def production = layout.buildDirectory.file("generated/source/buildConfig/$variant/com/projectblue/game/BuildConfig.java").get().asFile.text
            if (!production.contains('UMP_DEBUG_GEOGRAPHY = ""') || !production.contains('UMP_TEST_DEVICE_ID = ""'))
                throw new GradleException("$variant must not contain UMP debug settings")
        }
        logger.lifecycle('Debug ad configuration verified against the official sample IDs.')
        logger.lifecycle('QA/release UMP debug settings verified empty.')
    }
}
tasks.named('check') { dependsOn 'verifyDebugAdConfiguration' }

tasks.register('verifyReleaseBundle', JavaExec) {
    group = 'verification'
    description = 'Validate the release AAB with the bundletool version supplied by AGP.'
    dependsOn 'bundleRelease'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'validate', '--bundle=' + layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile.absolutePath
}

tasks.register('verifyReleaseArtifactApplicationId', JavaExec) {
    group = 'verification'
    description = 'Verify the final application ID directly in the release AAB.'
    dependsOn 'bundleRelease'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'dump', 'manifest', '--bundle=' + layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile.absolutePath, '--module=base'
    def manifestOutput = new ByteArrayOutputStream()
    standardOutput = manifestOutput
    doLast {
        if (!(manifestOutput.toString('UTF-8') =~ /package="com\.game\.diver\.oceanguard"/))
            throw new GradleException('Release AAB application ID must be com.game.diver.oceanguard')
        logger.lifecycle('Release AAB application ID verified: com.game.diver.oceanguard')
    }
}

tasks.register('verifyReleaseApplicationId') {
    group = 'verification'
    description = 'Verify the final release application ID in the merged manifest.'
    dependsOn 'processReleaseMainManifest'
    doLast {
        def manifest = layout.buildDirectory.file('intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists()) manifest = layout.buildDirectory.file('intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml').get().asFile
        if (!manifest.exists() || !(manifest.text =~ /package="com\.game\.diver\.oceanguard"/))
            throw new GradleException('Release application ID must be com.game.diver.oceanguard')
        logger.lifecycle('Release application ID verified: com.game.diver.oceanguard')
    }
}

tasks.register('dumpReleaseBundleConfig', JavaExec) {
    group = 'verification'
    description = 'Print the release AAB bundle configuration, including native library page alignment.'
    dependsOn 'bundleRelease'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'dump', 'config', '--bundle=' + layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile.absolutePath
}

def internalGooglePlayDirectory = rootProject.layout.buildDirectory.dir('store/google-play')
def packageInternalGooglePlayBundle = tasks.register('packageInternalGooglePlayBundle') {
    group = 'distribution'
    description = 'Build and preserve the signed, test-ad Google Play internal-testing bundle and R8 artifacts.'
    dependsOn 'verifyReleaseBundle', 'verifyReleaseArtifactApplicationId', rootProject.tasks.named('writeVersionInfo')
    doLast {
        def outputDirectory = internalGooglePlayDirectory.get().asFile
        outputDirectory.mkdirs()
        def sourceBundle = layout.buildDirectory.file('outputs/bundle/release/android-release.aab').get().asFile
        def bundleName = "ProjectBlue-OceanGuard-${versionInfo.versionName}-internal-google-play.aab"
        def outputBundle = new File(outputDirectory, bundleName)
        java.nio.file.Files.copy(sourceBundle.toPath(), outputBundle.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def checksum = java.security.MessageDigest.getInstance('SHA-256')
            .digest(outputBundle.bytes).encodeHex().toString()
        new File(outputDirectory, bundleName + '.sha256').setText(checksum + '  ' + bundleName + '\n', 'UTF-8')

        def r8Directory = layout.buildDirectory.dir('outputs/mapping/release').get().asFile
        ['mapping.txt', 'configuration.txt', 'seeds.txt', 'usage.txt'].each { reportName ->
            def report = new File(r8Directory, reportName)
            if (report.exists()) {
                def destination = new File(outputDirectory,
                    "ProjectBlue-OceanGuard-${versionInfo.versionName}-${reportName}")
                java.nio.file.Files.copy(report.toPath(), destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        logger.lifecycle("Google Play internal-testing AAB ready: ${outputBundle}")
    }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(packageInternalGooglePlayBundle.get())) {
        if (!hasSigning) {
            throw new GradleException('Google Play internal packaging requires all four OCEANGUARD_UPLOAD_* signing variables')
        }
        if (releaseAds) {
            throw new GradleException('Google Play internal packaging requires test/demo advertising configuration; unset PB_ADS_ENABLED')
        }
    }
}

// Keep the AGP output unchanged; export a versioned, self-describing test package.
def versionInfo = rootProject.buildVersion
def exportDirectory = rootProject.layout.buildDirectory.dir("artifacts/${versionInfo.versionName}")
tasks.register('packageDebugApk') {
    group = 'distribution'
    description = 'Export the debug APK with its Git version, checksum and build metadata.'
    dependsOn 'assembleDebug', rootProject.tasks.named('writeVersionInfo')
    def sourceApk = layout.buildDirectory.file('outputs/apk/debug/android-debug.apk')
    inputs.file(sourceApk)
    inputs.properties(versionInfo)
    outputs.dir(exportDirectory)
    doLast {
        def directory = exportDirectory.get().asFile
        directory.mkdirs()
        def apk = new File(directory, versionInfo.apkFileName)
        java.nio.file.Files.copy(sourceApk.get().asFile.toPath(), apk.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
        new File(directory, apk.name + '.sha256').setText(checksum + '  ' + apk.name + '\n', 'UTF-8')
        def details = new LinkedHashMap(versionInfo)
        details.sha256 = checksum
        new File(directory, 'BUILD.json').setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(details)) + '\n', 'UTF-8')
        logger.lifecycle("APK ready: ${apk}")
    }
}
