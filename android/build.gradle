def versionInfo = rootProject.buildVersion
def internalGooglePlayDirectory = rootProject.layout.buildDirectory.dir('store/google-play')
def internalTestBundle = { ->
    def bundles = fileTree(layout.buildDirectory.dir('outputs/bundle/internalTest')).matching { include '*.aab' }.files
    if (bundles.size() != 1) throw new GradleException("Expected one internalTest AAB, found ${bundles.size()}")
    bundles.first()
}
def verifyInternalTestBundle = tasks.register('verifyInternalTestBundle', JavaExec) {
    group = 'verification'
    description = 'Validate the internalTest AAB with the bundletool version supplied by AGP.'
    dependsOn 'bundleInternalTest'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    doFirst { args 'validate', '--bundle=' + internalTestBundle().absolutePath }
}
def verifyInternalTestArtifactApplicationId = tasks.register('verifyInternalTestArtifactApplicationId', JavaExec) {
    group = 'verification'
    dependsOn 'bundleInternalTest'
    classpath = buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    def manifestOutput = new ByteArrayOutputStream()
    standardOutput = manifestOutput
    doFirst { args 'dump', 'manifest', '--bundle=' + internalTestBundle().absolutePath, '--module=base' }
    doLast {
        def text = manifestOutput.toString('UTF-8')
        if (!(text =~ /package="com\.game\.diver\.oceanguard"/) || (text =~ /android:debuggable="true"/))
            throw new GradleException('internalTest AAB must use the production application ID and be non-debuggable')
    }
}
def packageInternalGooglePlayBundle = tasks.register('packageInternalGooglePlayBundle') {
    group = 'distribution'
    description = 'Build and preserve the signed, test-ad Google Play internal-testing bundle and R8 artifacts.'
    dependsOn verifyInternalTestBundle, verifyInternalTestArtifactApplicationId, 'verifyAdConfigurations', rootProject.tasks.named('writeVersionInfo')
    doFirst {
        if (!hasSigning) throw new GradleException('Google Play internal packaging requires all four OCEANGUARD_UPLOAD_* signing variables')
    }
    doLast {
        def outputDirectory = internalGooglePlayDirectory.get().asFile
        outputDirectory.mkdirs()
        def sourceBundle = internalTestBundle()
        def bundleName = "ProjectBlue-OceanGuard-${versionInfo.versionName}-internal-google-play.aab"
        def outputBundle = new File(outputDirectory, bundleName)
        java.nio.file.Files.copy(sourceBundle.toPath(), outputBundle.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def checksum = java.security.MessageDigest.getInstance('SHA-256')
            .digest(outputBundle.bytes).encodeHex().toString()
        new File(outputDirectory, bundleName + '.sha256').setText(checksum + '  ' + bundleName + '\n', 'UTF-8')

        def r8Directory = layout.buildDirectory.dir('outputs/mapping/internalTest').get().asFile
        ['mapping.txt', 'configuration.txt', 'resources.txt', 'seeds.txt', 'usage.txt'].each { reportName ->
            def report = new File(r8Directory, reportName)
            if (report.exists()) {
                def destination = new File(outputDirectory,
                    "ProjectBlue-OceanGuard-${versionInfo.versionName}-${reportName}")
                java.nio.file.Files.copy(report.toPath(), destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        logger.lifecycle("Google Play internal-testing AAB ready: ${outputBundle}")
    }
}

// Keep the AGP output unchanged; export a versioned, self-describing test package.
def exportDirectory = rootProject.layout.buildDirectory.dir("artifacts/${versionInfo.versionName}")
tasks.register('packageDebugApk') {
    group = 'distribution'
    description = 'Export the debug APK with its Git version, checksum and build metadata.'
    dependsOn 'assembleDebug', rootProject.tasks.named('writeVersionInfo')
    def sourceApk = layout.buildDirectory.file('outputs/apk/debug/android-debug.apk')
    inputs.file(sourceApk)
    inputs.properties(versionInfo)
    outputs.dir(exportDirectory)
    doLast {
        def directory = exportDirectory.get().asFile
        directory.mkdirs()
        def apk = new File(directory, versionInfo.apkFileName)
        java.nio.file.Files.copy(sourceApk.get().asFile.toPath(), apk.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
        new File(directory, apk.name + '.sha256').setText(checksum + '  ' + apk.name + '\n', 'UTF-8')
        def details = new LinkedHashMap(versionInfo)
        details.sha256 = checksum
        new File(directory, 'BUILD.json').setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(details)) + '\n', 'UTF-8')
        logger.lifecycle("APK ready: ${apk}")
    }
}
